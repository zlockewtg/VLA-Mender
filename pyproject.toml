[project]
name = "vla-mender"
version = "0.1.0"
description = "Generic LIBERO pre-repair infrastructure for VLA-Mender."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "gymnasium>=0.29",
  "numpy>=1.26",
  "torch>=2.8",
  "torchvision>=0.23",
  "av>=12",
  "tyro>=0.8.5",
  "pydantic>=2.7",
  "rich>=13.7",
  "scipy>=1.12",
  "matplotlib>=3.10",
  "imageio[ffmpeg]>=2.34",
  "requests>=2.32",
  "tqdm",
  "h5py",
  "einops",
  "decord",
  "pycocotools",
  "pyyaml",
  "omegaconf",
  "open3d",
  "ipywidgets>=8.0.4",
  "pyroki @ git+https://github.com/chungmin99/pyroki.git@95afccc22658c461ab1042a048ae4e9c24bc2a47",
  "robot-descriptions>=1.16.0",
  "yourdfpy>=0.0.56",
  "viser>=0.2.0",
  "trimesh>=4.4.0",
  "sam3",
  "msgpack-numpy",
  "ray==2.48.0",
  "mediapy>=1.2.5",
  "uvicorn",
  "fastapi",
  "transformers",
  "openai",
  "pyrender",
  "opencv-python-headless",
  "pillow>=10",
  "pandas>=2.0",
  "pyarrow>=15",
  "cloudpickle",
  "contact-graspnet-pytorch",
  "safetensors",
  "jax[cuda12]==0.5.3",
  "flax==0.10.2",
  "orbax-checkpoint==0.11.13",
  "dm-tree>=0.1.8",
  "equinox>=0.11.8",
  "flatbuffers>=24.3.25",
  "jaxtyping==0.2.36",
  "ml-collections==1.0.0",
  "numpydantic>=1.6.6",
  "lerobot @ git+https://github.com/huggingface/lerobot.git@0cf864870cf29f4738d3ade893e6fd13fbd7cdb5",
  "sentencepiece>=0.2.0",
  "tyro>=0.9.5",
  "beartype==0.19.0",
  "chex==0.1.90",
]

[project.optional-dependencies]
libero = [
  "libero",
  "robosuite",
  "easydict==1.9",
  "robomimic==0.2.0",
  "einops==0.4.1",
  "thop==0.1.1-2209072238",
  "bddl==1.0.1",
  "future==0.18.2",
  "cloudpickle==2.1.0",
  "gym==0.25.2",
  "scikit-learn",
]
# Backward-compatible alias. Contact-GraspNet is installed by default.
contactgraspnet = []

[tool.uv]
package = true
environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
constraint-dependencies = [
  "torch==2.8.0",
  "torchvision==0.23.0",
  "transformers==4.53.2",
  "open3d==0.19.0",
  "mujoco==3.8.1",
  "gymnasium==1.2.3",
  "opencv-python-headless==4.12.0.88",
  "pyrender==0.1.45",
  "pydantic==2.12.5",
  "fastapi==0.129.0",
  "scipy==1.17.0",
  "matplotlib==3.10.8",
  "h5py==3.15.1",
  "pandas==3.0.1",
  "pyarrow==25.0.0",
  "pillow==12.1.1",
  "av==18.0.0",
  "scikit-learn==1.8.0",
  "setuptools==75.8.2",
]
override-dependencies = [
  "transformers<5.0",
  "PyOpenGL==3.1.6",
  "PyOpenGL-accelerate==3.1.6",
  "numpy==1.26.4",
  "opencv-python-headless<4.13",
  "opencv-python ; sys_platform == 'never'",
  "jax<0.4.30",
  "jaxlib<0.4.30",
  "jaxls @ git+https://github.com/brentyi/jaxls.git@6fe7cf9d56223736b2c0272d080ec7346203c648",
]

[tool.uv.sources]
sam3 = { path = "third_party/sam3", editable = true }
contact-graspnet-pytorch = { path = "third_party/contact_graspnet_pytorch", editable = true }
libero = { path = "third_party/LIBERO-PRO", extra = "libero", editable = true }
robosuite = { path = "third_party/libero_dependencies/robosuite", extra = "libero", editable = true }

[tool.uv.extra-build-dependencies]
contact-graspnet-pytorch = ["numpy==1.26.4"]

[tool.hatch.build.targets.wheel]
packages = ["vla-mender/src/workflow", "vla-mender/src/run"]

[project.scripts]
vla-mender-pre-repair = "workflow.pipeline:main"
vla-mender-build-dataset = "workflow.dataset.cli:main"
vla-mender-libero-dataset-manifest = "workflow.dataset.libero_manifest:main"
vla-mender-dataset-run = "run.dataset.build:main"
vla-mender-post-train = "run.dataset.train:main"
