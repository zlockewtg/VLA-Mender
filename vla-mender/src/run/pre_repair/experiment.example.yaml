# Copy this file into a run directory, then fill the task-specific values there.
# `generate_prompt --settings <run>/experiment.yaml` uses that directory as run root.
task:
  suite: libero_goal
  task_id: 0
  checkpoint: /absolute/path/to/openpi/checkpoint
  policy_config: pi0_libero
  task_description: null
initial_states:
  provider: randomized_bddl  # official | randomized_bddl | state_manifest
  count: 50
  seed_start: 100000
  state_manifest: null
rollout:
  control_frequency_hz: 20
  max_steps: 300
  policy_seed: 7
  gpus: [0, 1, 2, 3]
  workers_per_gpu: 1
  action_chunk: 5
  inference_steps: 5
  num_steps_wait: 10
  binary_gripper: false
  gripper_hysteresis_threshold: 0.2
controller:
  source_control_space: osc
  target_control_space: osc
reset:
  frames_per_failure: 3
  frame_stride: 5
  dynamics: preserve_full_state  # preserve_full_state | quiescent_osc
backend:
  name: openpi
  openpi_environment: /absolute/path/to/VLA-Mender/.venv-openpi
  openpi_source: ../../../../third_party/openpi
  openpi_commit: 15a9616a00943ada6c20a0f158e3adb39df2ccac
  # openpi_norm_stats: /absolute/path/to/norm_stats.json
