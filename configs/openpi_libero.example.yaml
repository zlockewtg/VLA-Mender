# One resolved experiment file is passed to both rollout and diagnose.
task:
  suite: libero_goal
  task_id: 0
  checkpoint: /path/to/openpi-checkpoint
  policy_config: pi0_libero
  task_description: "describe the LIBERO task"
initial_states:
  provider: official
  count: 50
  seed_start: 100000
rollout:
  control_frequency_hz: 20
  max_steps: 300
  policy_seed: 7
  gpus: [0]
  workers_per_gpu: 1
  action_chunk: 5
  inference_steps: 5
  num_steps_wait: 10
  binary_gripper: true
  gripper_hysteresis_threshold: 0.2
controller:
  source_control_space: osc
  target_control_space: osc
reset:
  frames_per_failure: 3
  frame_stride: 5
  dynamics: preserve_full_state
backend:
  name: openpi
  openpi_environment: /path/to/VLA-Mender/.venv-openpi
  openpi_source: third_party/openpi
  openpi_commit: 15a9616a00943ada6c20a0f158e3adb39df2ccac
  # Optional when stats are stored outside the checkpoint:
  # openpi_norm_stats: /path/to/norm_stats.json
